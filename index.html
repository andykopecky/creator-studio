<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Creator Studio: brand deals, schedule, payments and contacts for content creators.">
<meta name="theme-color" content="#f4efe7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191715" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Creator Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Creator Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: airy, near-white workspace; Today opens on one big number and a dotted progress ring, then soft frosted cards. Ink black, soft greys, two pastel blurs. */
:root{
  --bg:#f3f3f1; --side:#f7f7f5; --card:#ffffff; --fg:#151515; --muted:#8b8b87; --line:#ebebe8; --line2:#dfdfdb;
  --primary:#171717; --primary-h:#000000; --on-primary:#ffffff;
  --green:#f0f0ed; --green2:#e8e8e4; --amber:#f4ede0; --amber-fg:#7a5a1c; --red-bg:#f7e5e1; --red:#a23b2a; --ok:#4d6a49; --avatar:#e6e6e2; --gift:#f2e7eb; --gift-fg:#7a4659;
  --cv-a:#efdcdc; --cv-b:#dde6d6; --cv-c:#f4f4f2; --cv-d:#e9e9e6;
  --glass:rgba(255,255,255,.55); --glass-line:rgba(255,255,255,.85); --panel:rgba(255,255,255,.78); --blob-a:#f2c9cf; --blob-b:#c9dcbc; --blob-c:#ece3cf; --dot:#c9c9c4;
  --shadow:0 20px 50px rgba(20,20,20,.10);
  --f-body:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-display:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111111; --side:#151515; --card:#1b1b1b; --fg:#f2f2f0; --muted:#9a9a96; --line:#262626; --line2:#323232;
  --primary:#f2f2f0; --primary-h:#ffffff; --on-primary:#111111;
  --green:#202020; --green2:#2a2a2a; --amber:#3a3020; --amber-fg:#e9c27e; --red-bg:#3c2320; --red:#f0a090; --ok:#a9c79f; --avatar:#2e2e2e; --gift:#37262d; --gift-fg:#e7b3c2;
  --cv-a:#3a2a2a; --cv-b:#26302a; --cv-c:#1b1b1b; --cv-d:#222222;
  --glass:rgba(30,30,30,.55); --glass-line:rgba(255,255,255,.07); --panel:rgba(27,27,27,.82); --blob-a:#4a2a30; --blob-b:#2c3d28; --blob-c:#3a3326; --dot:#3a3a3a;
  --shadow:0 20px 50px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111111; --side:#151515; --card:#1b1b1b; --fg:#f2f2f0; --muted:#9a9a96; --line:#262626; --line2:#323232;
  --primary:#f2f2f0; --primary-h:#ffffff; --on-primary:#111111;
  --green:#202020; --green2:#2a2a2a; --amber:#3a3020; --amber-fg:#e9c27e; --red-bg:#3c2320; --red:#f0a090; --ok:#a9c79f; --avatar:#2e2e2e; --gift:#37262d; --gift-fg:#e7b3c2;
  --cv-a:#3a2a2a; --cv-b:#26302a; --cv-c:#1b1b1b; --cv-d:#222222;
  --glass:rgba(30,30,30,.55); --glass-line:rgba(255,255,255,.07); --panel:rgba(27,27,27,.82); --blob-a:#4a2a30; --blob-b:#2c3d28; --blob-c:#3a3326; --dot:#3a3a3a;
  --shadow:0 20px 50px rgba(0,0,0,.5); color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font:400 40px/1.05 var(--f-display);letter-spacing:-.01em;color:var(--fg)}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:13px;font-weight:500;color:var(--muted)}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;padding:22px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.mark{width:34px;height:34px;border-radius:50%;background:var(--avatar);color:var(--fg);display:grid;place-items:center;font:400 18px var(--f-display);overflow:hidden;flex:none}
.mark img{width:100%;height:100%;object-fit:cover}
.brand b{font:400 21px/1.1 var(--f-display);display:block}
.brand span{font-size:12.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 12px;border-radius:999px;cursor:pointer;font-weight:500;text-align:left;color:var(--fg)}
.nav button:hover{background:var(--green)}
.nav button[aria-current="page"]{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(20,20,20,.06)}
.nav .count{margin-left:auto;font-size:12px;font-weight:600;background:var(--amber);color:var(--amber-fg);border-radius:20px;padding:1px 8px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px 10px;border-top:1px solid var(--line);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--amber-fg)} .dot.bad{background:var(--red)}
.status-line{display:flex;align-items:center;gap:8px}
.bell{position:relative;border:1px solid var(--line2);background:var(--card);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--fg);flex:none}
.bell:hover{border-color:var(--primary)}
.bell-n{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--side)}
.sched-chips{display:flex;gap:8px;flex-wrap:wrap}
.schip{border:1px solid var(--line2);background:var(--card);border-radius:20px;padding:6px 14px;cursor:pointer;font-size:14px;color:var(--fg)}
.schip b{font-family:var(--f-head);font-size:16px;margin-right:2px}
.schip.red{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.schip:hover{border-color:var(--primary)}
.subhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:12px 18px 4px;font:700 13px var(--f-head);text-transform:uppercase;letter-spacing:.05em;border-top:1px solid var(--line)}
.subhead:first-child{border-top:0}
.subhead .muted{font:400 13px var(--f-body);text-transform:none;letter-spacing:0}
.pill.work{background:var(--green2);color:var(--fg)}
.pill.routine{background:var(--green);color:var(--primary)}
.pill.routine .ico{width:13px;height:13px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.day{background:var(--card);min-height:150px;padding:8px;display:flex;flex-direction:column;gap:5px;min-width:0}
.day.today{background:var(--green)}
.day.past{opacity:.6}
.day-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.day.today .day-head span{color:var(--primary)}
.day-head .iconbtn{padding:3px}
.ev{display:flex;flex-direction:column;gap:1px;text-align:left;border:0;border-radius:7px;padding:5px 7px;font-size:12.5px;line-height:1.3;cursor:pointer;color:var(--fg);overflow-wrap:anywhere;width:100%}
.ev .ev-k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.ev.due{background:var(--amber);color:var(--amber-fg)}
.ev.work{background:var(--green2);border-left:3px solid var(--primary)}
.ev.late{background:var(--red-bg);color:var(--red)}
.ev.routine{background:none;border:1px dashed var(--primary);color:var(--primary);flex-direction:row;align-items:center;gap:5px}
.ev.routine .ico{width:13px;height:13px}
.ev.routine.is-done{text-decoration:line-through;opacity:.6}
.free{font-size:12px;color:var(--muted);margin-top:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 18px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:12px;height:12px;border-radius:3px;display:inline-block}
.lg.due{background:var(--amber)} .lg.work{background:var(--green2);border-left:3px solid var(--primary)} .lg.routine{border:1px dashed var(--primary)} .lg.late{background:var(--red-bg)}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.dp{border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:7px 10px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--fg);min-width:48px}
.dp.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
@media (max-width:900px){.week{grid-template-columns:minmax(0,1fr)}.day{min-height:0;flex-direction:column}.day.past{display:none}.free{margin-top:0}}
.cover{position:relative;margin-top:-28px;margin-inline:-32px}
.cover-img{height:230px;background:radial-gradient(120% 140% at 0% 0%,var(--cv-a) 0%,transparent 55%),radial-gradient(90% 120% at 100% 100%,var(--cv-b) 0%,transparent 60%),linear-gradient(135deg,var(--cv-c),var(--cv-d));background-size:cover;background-position:center 50%;position:relative}
.cover-img.dark-def{background:linear-gradient(135deg,#2a2520,#3a322a)}
.cover-actions{position:absolute;right:16px;bottom:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;opacity:.0;transition:opacity .15s}
.cover:hover .cover-actions,.cover:focus-within .cover-actions,.cover-actions.show{opacity:1}
.glass{background:rgba(251,249,245,.86);border-color:transparent;color:#2a2622;backdrop-filter:blur(6px)}
.glass:hover{background:#fbf9f5;border-color:transparent}
.cover-id{display:flex;align-items:flex-end;gap:18px;padding:0 32px;margin-top:-52px;position:relative;flex-wrap:wrap}
.me{width:104px;height:104px;border-radius:50%;border:4px solid var(--bg);background:var(--avatar);display:grid;place-items:center;font:400 40px var(--f-display);overflow:hidden;flex:none;cursor:pointer;padding:0;color:var(--fg)}
.me img{width:100%;height:100%;object-fit:cover}
.cover-id .who{padding-bottom:6px;min-width:0}
.cover-id .who p{color:var(--muted);margin-top:4px}
.pos{position:absolute;left:16px;bottom:14px;display:flex;align-items:center;gap:8px;background:rgba(251,249,245,.9);border-radius:9px;padding:6px 10px;font-size:13px;color:#2a2622}
@media (hover:none){.cover-actions{opacity:1}}
@media (max-width:760px){.cover{margin-top:-20px;margin-inline:-16px}.cover-img{height:160px}.cover-id{padding:0 16px;margin-top:-44px}.me{width:84px;height:84px;font-size:32px}}
.main{position:relative;isolation:isolate}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px 40px;align-items:center}
.hero-top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.hero-top h1{font-size:46px}
.hero-top p{color:var(--muted);margin-top:6px}
.hero-me{width:52px;height:52px;border-radius:50%;background:var(--avatar);display:grid;place-items:center;overflow:hidden;border:0;padding:0;cursor:pointer;font:400 22px var(--f-display);color:var(--fg);flex:none}
.hero-me img{width:100%;height:100%;object-fit:cover}
.ring{width:220px;height:220px;display:block}
.big{font:300 76px/1 var(--f-body);letter-spacing:-.04em}
.big-sub{color:var(--muted);margin-top:8px;font-size:14px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.mini button{border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:18px;padding:14px 16px;text-align:left;cursor:pointer;color:var(--fg);font:inherit;min-width:0}
.mini button:hover{border-color:var(--primary)}
.mini .k{font-size:13px;color:var(--muted)}
.mini .v{font-size:17px;font-weight:500;margin-top:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glass-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.glass-card{position:relative;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:26px;padding:20px 20px 22px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;cursor:pointer;text-align:left;color:var(--fg);font:inherit;box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
.glass-card:hover{border-color:var(--line2)}
.glass-card h3{font:400 24px/1.1 var(--f-body);letter-spacing:-.02em;max-width:9ch}
.glass-card p{font-size:13px;color:var(--muted);max-width:28ch}
.glass-card .plus{position:absolute;right:16px;bottom:16px;width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 4px 14px rgba(20,20,20,.08)}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr);gap:18px}.hero-top h1{font-size:40px}.ring{width:200px;height:200px;margin:4px auto}.big{font-size:64px}.mini{grid-template-columns:repeat(2,minmax(0,1fr))}.mini button:last-child{grid-column:1/-1}.glass-row{grid-template-columns:minmax(0,1fr)}.glass-card{min-height:132px}}
.type-hint{font-size:13px;color:var(--muted);font-weight:400;font-family:var(--f-body)}

.main{overflow-y:auto;min-width:0}
.page{max-width:1180px;margin:0 auto;padding-block:28px 64px;padding-inline:32px;display:flex;flex-direction:column;gap:24px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head p{color:var(--muted);margin-top:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

.ico{width:18px;height:18px;flex:none;display:inline-block}
.ico svg{width:100%;height:100%;display:block}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-h);border-color:var(--primary-h)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--green)}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;display:inline-flex;color:var(--muted)}
.iconbtn:hover{background:var(--green);color:var(--fg)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-body{padding:14px 18px}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-family:var(--f-head)}
.notice{border-radius:10px;padding:12px 14px;background:var(--amber);color:var(--amber-fg);font-size:14px;display:flex;gap:10px;align-items:flex-start}
.notice.info{background:var(--green);color:var(--fg)}
.notice.bad{background:var(--red-bg);color:var(--red)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:20px;padding:2px 9px;background:var(--green2);color:var(--fg);white-space:nowrap}
.pill.amber{background:var(--amber);color:var(--amber-fg)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.ok{background:var(--green);color:var(--ok)}
.pill.paid{background:var(--primary);color:var(--on-primary)}
.pill.gift{background:var(--gift);color:var(--gift-fg)}
.col-div{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:4px 2px 0}
.col-div::after{content:"";flex:1;border-top:1px dashed var(--line2)}
.split{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.split{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.split .stat{padding:10px 11px}.split .stat .small,.split .stat .go{display:none}.split .stat .v{font-size:20px}.split .label{font-size:12px}}
.pill.talks{background:var(--amber);color:var(--amber-fg);border:1px dashed var(--amber-fg)}
.pill.undecided{background:none;border:1px dashed var(--line2);color:var(--muted)}
.stat-btn{text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%;display:block}
.stat-btn:hover{border-color:var(--primary)}
.stat-btn .go{font-size:12.5px;font-weight:600;color:var(--primary);margin-top:6px;display:inline-flex;align-items:center;gap:4px}
.filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--green);border-radius:10px;padding:8px 12px;font-size:14px}
.pill.plain{background:none;border:1px solid var(--line2);color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{padding:14px 16px}
.stat .v{font:500 26px/1.2 var(--f-body);margin-top:10px;letter-spacing:-.01em}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.click{cursor:pointer}
.item.click:hover{background:var(--green)}
.item .t{font-weight:600}
.item .sub{color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--avatar);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);background:var(--card);cursor:pointer;flex:none;display:grid;place-items:center;margin-top:2px;padding:0;color:var(--on-primary)}
.check[aria-checked="true"]{background:var(--primary);border-color:var(--primary)}
.check svg{width:13px;height:13px}
.done .t{text-decoration:line-through;color:var(--muted)}

/* inbox */
.tabs{display:flex;gap:4px;background:var(--green2);padding:4px;border-radius:999px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.inbox{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.thread-list .item{padding:12px 16px}
.thread-list .item.active{background:var(--green2)}
.thread-list .item.unread .t{font-weight:700}
.thread-list .meta{font-size:12.5px;color:var(--muted);white-space:nowrap}
.msg{border-top:1px solid var(--line);padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.msg:first-child{border-top:0}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.msg.collapsed .body{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted)}
.search{display:flex;gap:8px;flex:1;min-width:220px;max-width:420px}

/* board */
.board-wrap{overflow-x:auto;padding-bottom:8px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:12px;align-items:start}
.col{background:var(--green);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col-head{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px;font:700 13.5px var(--f-head)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--primary)}
.card .b{font-weight:700}
.card .c{font-size:13.5px;color:var(--muted)}

/* table */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;font-weight:600}
.field small{color:var(--muted);font-size:12.5px}
.input{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:9px 11px;min-width:0}
.input:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:var(--primary)}
textarea.input{resize:vertical;min-height:90px;line-height:1.5}
.span2{grid-column:1/-1}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(20,24,16,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-body{flex:1;overflow-y:auto;padding:18px 20px}
.drawer-foot{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);background:var(--side)}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(780px,calc(100% - 32px));max-height:calc(100% - 48px);background:var(--bg);z-index:23;border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.sheet-scrim{z-index:22}
.sugg{border:1.5px dashed var(--gift-fg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.sugg-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;max-height:300px;overflow-y:auto}
.confirm-layer{position:fixed;inset:0;z-index:30;background:rgba(20,24,16,.45);display:grid;place-items:center;padding:16px}
.confirm-card{background:var(--bg);border-radius:16px;box-shadow:var(--shadow);width:min(460px,100%);padding:22px;display:flex;flex-direction:column;gap:14px}
.ai-box{background:var(--green);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:20px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--fg)}
.chip:hover{border-color:var(--primary)}
.review{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.review .r{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.review .r:first-child{border-top:0}
.review .r>span:first-child{color:var(--muted);font-weight:600}
.review .bodyview{padding:14px;border-top:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;max-height:320px;overflow-y:auto}
.confirm-box{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--green);cursor:pointer;font-weight:500}
.confirm-box input{width:18px;height:18px;margin-top:2px;accent-color:var(--primary)}
.sent-hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:10px 0 4px}
.sent-hero .big{width:56px;height:56px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.sent-hero .big svg{width:28px;height:28px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:14px}
.kv>span:nth-child(odd){color:var(--muted)}
.kv>span{overflow-wrap:anywhere}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line2);border-top-color:var(--primary);animation:sp .8s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

.blobs .b1{width:300px;height:300px;left:-60px;top:-40px;background:var(--blob-a)}
.blobs .b2{width:340px;height:300px;right:-80px;bottom:-60px;background:var(--blob-b);animation-duration:26s;animation-delay:-6s}
.blobs .b3{width:220px;height:220px;right:22%;top:30%;background:var(--blob-c);opacity:.45;animation-duration:30s;animation-delay:-12s}
@keyframes floaty{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(40px,30px) rotate(8deg)}100%{transform:translate(-20px,50px) rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){.blobs i{animation:none}}
.app{position:relative;z-index:1}
.top-right{display:flex;align-items:center;gap:8px}
@media (min-width:761px){

  .side{flex-direction:row;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px 8px;background:transparent;border:0;overflow:visible}

  .side .nav,.side-foot{display:none}
  .brand{padding:0;flex:1;gap:10px}

  .m-only{display:inline-flex}
  .side .mark{display:none}
  .main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-line);border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(20,20,20,.12)}
  .side{background:transparent;border-bottom:0}
  .tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;position:relative;border-radius:10px}
  .tab .ico{width:22px;height:22px}

  .tab.plus .ico{width:46px;height:46px;padding:12px;border-radius:50%;background:var(--primary);color:var(--on-primary);box-shadow:0 6px 16px rgba(20,20,20,.2)}
  .tab.plus{justify-content:center}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .page{padding-inline:16px;padding-block:20px 32px;gap:18px}
  .page-head .row .btn{flex:1;justify-content:center}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .input{font-size:16px}
  .btn{padding:10px 14px}
  .item{padding:14px 16px}
  .sheet{left:0;top:0;transform:none;width:100%;max-height:none;height:100%;border-radius:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  h1{font-size:32px}

  .cover-img{height:130px}

  .stat .v{font-size:22px}
  .inbox.has-thread .thread-list{display:none}
  .inbox:not(.has-thread) .thread-pane{display:none}
}
.sheet-menu{position:fixed;left:0;right:0;bottom:0;z-index:23;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;max-width:560px;margin:0 auto}

.sheet-menu .mi:hover{background:var(--green)}
.sheet-menu .mi .ico{width:22px;height:22px;color:var(--primary)}
.sheet-menu .mi small{display:block;color:var(--muted);font-size:13px;font-weight:400}

<script>
"use strict";
/* ---------- constants ---------- */
const STAGES=['Lead','Pitched','Negotiating','Booked','Creating','Delivered','Needs review','Closed','Declined'];
const PAY=['Not invoiced','Invoiced','Paid'];

const GM='Gmail';

const ICONS={
 today:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

 settings:'<path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',

function icon(n){const s=document.createElement('span');s.className='ico';s.setAttribute('aria-hidden','true');s.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[n]||'')+'</svg>';return s}

/* ---------- tiny DOM helper ---------- */
function h(tag,attrs,...kids){
  const el=document.createElement(tag);let val;
  if(attrs)for(const[k,v]of Object.entries(attrs)){
    if(v==null||v===false)continue;
    if(k.startsWith('on')&&typeof v==='function')el.addEventListener(k.slice(2),v);
    else if(k==='class')el.className=v;
    else if(k==='value')val=v;
    else if(k==='checked')el.checked=!!v;
    else el.setAttribute(k,v===true?'':v);
  }
  for(const k of kids.flat(Infinity)){if(k==null||k===false)continue;el.append(k.nodeType?k:document.createTextNode(String(k)))}
  if(val!==undefined)el.value=val;
  return el;
}
const $=s=>document.querySelector(s);

/* ---------- formatting ---------- */
const pad=n=>String(n).padStart(2,'0');
function ymd(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseYmd(s){if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parseYmd(s);if(!d)return '';d.setDate(d.getDate()+n);return ymd(d)}
function daysFrom(s){const d=parseYmd(s);if(!d)return null;const t=parseYmd(ymd());return Math.round((d-t)/864e5)}
function fmtDay(s){const d=parseYmd(s);if(!d)return '';const n=daysFrom(s);if(n===0)return 'Today';if(n===1)return 'Tomorrow';if(n===-1)return 'Yesterday';return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:d.getFullYear()!==new Date().getFullYear()?'numeric':undefined})}
function fmtWhen(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';const now=new Date();if(d.toDateString()===now.toDateString())return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:d.getFullYear()!==now.getFullYear()?'numeric':undefined})}
function fmtFull(ms){const d=new Date(ms);return isNaN(d)?'':d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}
function money(n,c){if(n==null||n===''||isNaN(Number(n)))return '';try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c||defCur(),maximumFractionDigits:2}).format(Number(n))}catch{return Number(n).toLocaleString()+' '+(c||'')}}
function decode(s){const t=document.createElement('textarea');t.innerHTML=String(s||'');return t.value.replace(/[͏‌​­]/g,'').replace(/\s{2,}/g,' ').trim()}
function parseAddr(s){s=String(s||'').trim();const m=s.match(/^\s*"?([^"<]*?)"?\s*<([^>]+)>\s*$/);if(m)return{name:m[1].trim()||m[2],email:m[2].trim().toLowerCase()};return{name:s.split('@')[0]||s,email:s.toLowerCase()}}
function initials(n){const p=String(n||'?').replace(/[^\p{L}\p{N} ]/gu,' ').trim().split(/\s+/);return((p[0]||'?')[0]+((p[1]||'')[0]||'')).toUpperCase()}
function emails(s){return String(s||'').split(/[,;\s]+/).map(x=>x.trim()).filter(Boolean)}

/* ---------- state ---------- */
const S={routines:[],campaigns:[],tasks:[],invoices:[],contacts:[],sent:[],settings:{},ready:{},
  lists:{unread:{threads:[],loading:true,error:null,key:'',unsub:null,at:null},deals:{threads:[],loading:true,error:null,key:'',unsub:null,at:null},inbox:{threads:[],loading:true,error:null,key:'',unsub:null,at:null}},

let page=(location.hash||'').replace('#','')||'today';
if(!['today','inbox','campaigns','schedule','payments','contacts','settings'].includes(page))page='today';

/* ---------- persistence ---------- */
function clean(o){return JSON.parse(JSON.stringify(o))}
async function save(coll,obj){
  const{id,...rest}=obj;rest.updatedAt=Date.now();if(!rest.createdAt)rest.createdAt=Date.now();
  if(base){const ref=id?base.collection(coll).doc(id):base.collection(coll).doc();await ref.set(clean(rest));return ref.id}
  const nid=id||('m'+Math.random().toString(36).slice(2,10));const rec={...clean(rest),id:nid};

  const prompt='You help a content creator track brand deals. Read the email thread below and return ONLY a JSON object with exactly these keys:\n'+
   '{"brand":string,"campaign":string,"contactEmail":string,"feeProposed":number|null,"currency":string,"deliverables":string,"dueDate":string,"postingDate":string,"paymentTerms":string,"usageRights":string,"stage":string,"notes":string}\n'+

  let r;

  catch(e){if(e?.code==='not_granted'||e?.code==='sampling_disabled')S.aiOk=false;closeDrawer();openCampaign(fallback,{aiNote:aiErr(e)+' Fill in the details from the email instead.'});return}
